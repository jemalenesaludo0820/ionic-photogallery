name: Build APK

# 1. Run the workflow when changes are pushed to the main branch
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 2. Get the project files from GitHub
      - name: Checkout
        uses: actions/checkout@v4

      # 3. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 4. Install project dependencies
      - name: Install dependencies
        run: npm install

      # 5. Build the Vue application
      - name: Build Vue app
        run: npm run build

      # 6. Sync the web project with Capacitor Android
      - name: Sync Capacitor
        run: npx cap sync android

      # 7. Install Java for Android build
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 8. Give permission to run Gradle
      - name: Give permission to gradlew
        run: chmod +x android/gradlew

      # 9. Build the Android APK
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      # 10. Upload the generated APK as a GitHub Actions artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IonicPhotogallery-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30